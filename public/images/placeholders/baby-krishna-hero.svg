<svg width="600" height="700" viewBox="0 0 600 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="300" cy="350" r="350" gradientUnits="userSpaceOnUse">
      <stop stopColor="#1E5C78" />
      <stop offset="0.6" stopColor="#17345C" />
      <stop offset="1" stopColor="#0B1D2D" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="600" y2="700" gradientUnits="userSpaceOnUse">
      <stop stopColor="#FFF8E8" />
      <stop offset="0.5" stopColor="#D5AE61" />
      <stop offset="1" stopColor="#9C772F" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="url(#bgGlow)" />

  <!-- Outer Ornate Frame -->
  <rect x="25" y="25" width="550" height="650" rx="36" stroke="url(#goldBorder)" stroke-width="3" fill="none" opacity="0.85" />
  <rect x="40" y="40" width="520" height="620" rx="26" stroke="#D5AE61" stroke-width="1.2" stroke-dasharray="6 6" fill="none" opacity="0.6" />

  <!-- Center Circle for Portrait -->
  <circle cx="300" cy="310" r="170" fill="#174F68" stroke="url(#goldBorder)" stroke-width="4" />
  <circle cx="300" cy="310" r="160" fill="#17345C" />

  <!-- Stylized Baby Krishna Silhouette / Icon -->
  <circle cx="300" cy="270" r="50" fill="#90CDF4" />
  <!-- Peacock Feather on Head -->
  <path d="M295 210 C 285 190, 290 170, 305 160 C 320 170, 325 190, 315 210 Z" fill="#287B70" />
  <circle cx="305" cy="185" r="10" fill="#D5AE61" />
  <circle cx="305" cy="185" r="6" fill="#17345C" />
  <!-- Flute -->
  <rect x="230" y="320" width="140" height="10" rx="5" fill="#D5AE61" transform="rotate(-15 300 320)" />

  <!-- Baby Body Silhouette -->
  <path d="M245 380 C 240 330, 360 330, 355 380 Z" fill="#90CDF4" />

  <!-- Labels -->
  <text x="300" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#FFF8E8" letter-spacing="2">
    BABY AADHVIK
  </text>
  <text x="300" y="565" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#D5AE61" font-weight="600" letter-spacing="3">
    TURNS ONE YEAR OLD
  </text>
  <text x="300" y="605" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#FFF8E8" opacity="0.7">
    [ Baby Photo Placeholder • Elora Moments ]
  </text>
</svg>

